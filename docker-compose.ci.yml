# Self-contained stack for running the Cypress E2E suite in CI.
#
# NOTE: this file lives at the repo root, NOT in docker/ — docker/ is the
# arches-container-toolkit git submodule, so files added there are not tracked
# by this repo and never reach CI. It still uses the submodule's Dockerfile /
# entrypoint.sh / init-unix.sql via the absolute ${ARCHES_PROJECT_ROOT}.
#
# Unlike docker/docker-compose.yml (local dev), this file:
#   - bootstraps the coral package + data on first boot
#     (ALLOW_BOOTSTRAP + INSTALL_CORAL_PACKAGE), so a fresh runner has data;
#   - runs with DJANGO_INSECURE_COOKIES=True so session/CSRF cookies are not
#     dropped over plain http://localhost:8000 (see coral/settings.py:544-554);
#   - does NOT mount sibling ../arches / ../arches_apps editable checkouts —
#     the app image already has arches pip-installed;
#   - adds a healthcheck on the arches service so the workflow can wait for the
#     (slow) package load before seeding + running Cypress.
#
# Expects ARCHES_PROJECT_ROOT (abs path to the checked-out project, trailing /)
# and ARCHES_BASE to be exported by the caller, matching the Makefile convention.

services:
    cantaloupe:
      image: uclalibrary/cantaloupe:5.0.3-0

    db:
      image: ghcr.io/flaxandteal/arches-postgis:docker-8.1
      volumes:
          - ${ARCHES_PROJECT_ROOT}./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql
      ports:
        - '5432:5432'
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=postgres
        - TZ=PST
      command: >
        postgres
          -c shared_buffers=256MB
          -c fsync=off
          -c synchronous_commit=off
          -c full_page_writes=off
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 20

    elasticsearch:
      image: elasticsearch:9.0.4
      ports:
        - "9200:9200"
      ulimits:
        memlock:
          soft: -1
          hard: -1
      environment:
        - TZ=PST
        - discovery.type=single-node
        - discovery.seed_hosts=[]
        - xpack.security.enabled=false
        - xpack.ml.enabled=false
        - xpack.watcher.enabled=false
        - xpack.monitoring.collection.enabled=false
        - bootstrap.memory_lock=true
        - cluster.routing.allocation.disk.threshold_enabled=false
        - action.auto_create_index=true
        # 1g heap keeps the whole stack within a GitHub-hosted runner's ~7GB.
        - "ES_JAVA_OPTS=-Xms1g -Xmx1g -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=75"
      healthcheck:
        test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 30
        start_period: 30s

    rabbitmq:
      image: rabbitmq:3-management
      environment:
        - RABBITMQ_DEFAULT_USER=rabbitmq
        - RABBITMQ_DEFAULT_PASS=rabbitmq
        - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq deprecated_features.permit.transient_nonexcl_queues true

    arches:
      user: root
      build:
        context: ${ARCHES_PROJECT_ROOT}./..
        dockerfile: ${ARCHES_PROJECT_ROOT}./docker/Dockerfile
        args:
          - ARCHES_PROJECT=$ARCHES_PROJECT
          - ARCHES_BASE=$ARCHES_BASE
          - EDITABLE_BASE=False
          - USE_LOCAL_APPS=false
      command: run_arches
      environment:
        - ARCHES_PROJECT=$ARCHES_PROJECT
        # --- CI bootstrap: build a fresh DB with the coral package + data ---
        - ALLOW_BOOTSTRAP=True
        - INSTALL_CORAL_PACKAGE=True
        - INSTALL_DEFAULT_GRAPHS=False
        - INSTALL_DEFAULT_CONCEPTS=False
        # --- the cookie fix: cookies must not be Secure over http:// in CI ---
        - DJANGO_INSECURE_COOKIES=True
        - PGUSERNAME=postgres
        - PGPASSWORD=postgres
        - PGDBNAME=arches
        - PGHOST=db
        - PGPORT=5432
        - ESHOST=elasticsearch
        - ESPORT=9200
        - RABBITMQ_USER=rabbitmq
        - RABBITMQ_PASS=rabbitmq
        - RABBITMQ_HOST=rabbitmq
        - CELERY_BROKER_URL=amqp://rabbitmq:rabbitmq@rabbitmq
        - CANTALOUPE_HOST=cantaloupe
        - CANTALOUPE_PORT=8182
        - DJANGO_MODE=DEV
        - DJANGO_DEBUG=True
        - DOMAIN_NAMES=localhost
        - COMPRESS_OFFLINE=False
        - COMPRESS_ENABLED=False
        - STATIC_URL=/static/
        - STATIC_ROOT=/static_root
        - WEB_ROOT=/web_root
        - PYTHONUNBUFFERED=1
        - TZ=PST
      ports:
        - '8000:8000'
      depends_on:
        db:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
        rabbitmq:
          condition: service_started
        cantaloupe:
          condition: service_started
      healthcheck:
        test: ["CMD-SHELL", "curl -sf http://localhost:8000/templates/views/components/language-switcher.htm || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 200
        start_period: 60s

    arches_worker:
      user: root
      restart: unless-stopped
      build:
        context: ${ARCHES_PROJECT_ROOT}./..
        dockerfile: ${ARCHES_PROJECT_ROOT}./docker/Dockerfile
        args:
          - ARCHES_PROJECT=$ARCHES_PROJECT
          - ARCHES_BASE=$ARCHES_BASE
          - EDITABLE_BASE=False
          - USE_LOCAL_APPS=false
      command: run_celery
      environment:
        - ARCHES_PROJECT=$ARCHES_PROJECT
        # The web app owns the bootstrap; the worker must never re-run it.
        - ALLOW_BOOTSTRAP=False
        - INSTALL_CORAL_PACKAGE=False
        - INSTALL_DEFAULT_GRAPHS=False
        - INSTALL_DEFAULT_CONCEPTS=False
        - DJANGO_INSECURE_COOKIES=True
        - PGUSERNAME=postgres
        - PGPASSWORD=postgres
        - PGDBNAME=arches
        - PGHOST=db
        - PGPORT=5432
        - ESHOST=elasticsearch
        - ESPORT=9200
        - RABBITMQ_USER=rabbitmq
        - RABBITMQ_PASS=rabbitmq
        - RABBITMQ_HOST=rabbitmq
        - CELERY_BROKER_URL=amqp://rabbitmq:rabbitmq@rabbitmq
        - CANTALOUPE_HOST=cantaloupe
        - CANTALOUPE_PORT=8182
        - DJANGO_MODE=DEV
        - DJANGO_DEBUG=True
        - DOMAIN_NAMES=localhost
        - COMPRESS_OFFLINE=False
        - COMPRESS_ENABLED=False
        - STATIC_URL=/static/
        - STATIC_ROOT=/static_root
        - WEB_ROOT=/web_root
        - PYTHONUNBUFFERED=1
        - TZ=PST
      depends_on:
        db:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
        rabbitmq:
          condition: service_started
        arches:
          condition: service_started
